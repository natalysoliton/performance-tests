# Конфигурация нагрузочного тестирования для сценария нового пользователя
# Сценарий: new_user_issue_physical_card - выпуск физической дебетовой карты
# Протокол: HTTP
# Сервис: http-gateway

# Путь до файла сценария
locustfile = ./scenarios/http/gateway/new_user_issue_physical_card/scenario.py

# Общее количество виртуальных пользователей
# Выбрано 50, так как сценарий не является пиковым
users = 50

# Скорость запуска пользователей (пользователей/секунду)
# Плавный запуск для равномерной нагрузки
spawn-rate = 5

# Продолжительность теста (4 минуты)
run-time = 4m

# Запуск без веб-интерфейса
headless = true

# Путь для сохранения HTML-отчёта
html = ./scenarios/http/gateway/new_user_issue_physical_card/report.html

# Уровень логирования
loglevel = INFO

# Хост (фиктивное значение, так как клиент использует свой base_url)
host = localhost