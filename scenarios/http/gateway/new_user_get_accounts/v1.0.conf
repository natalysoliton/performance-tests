# Конфигурация нагрузочного тестирования для сценария получения счетов
# Версия: 1.0
# Протокол: HTTP
# Сервис: http-gateway

# Путь до файла сценария
locustfile = ./scenarios/http/gateway/new_user_get_accounts/scenario.py

# Общее количество виртуальных пользователей
users = 300

# Скорость запуска пользователей (пользователей/секунду)
spawn-rate = 30

# Продолжительность теста (3 минуты)
run-time = 3m

# Запуск без веб-интерфейса
headless = true

# Путь для сохранения HTML-отчёта
html = ./scenarios/http/gateway/new_user_get_accounts/report.html

# Уровень логирования
loglevel = INFO

# Хост (фиктивное значение, так как клиент использует свой base_url)
host = localhost